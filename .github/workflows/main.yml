name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android bcryptjs

      - name: Build Web App with Direct Supabase Fallbacks
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qbmezzgtsirybenjrsnb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibWV6emd0c2lyeWJlbmpyc25iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMzYxMTksImV4cCI6MjEwMjYxMjExOX0.VPdouvdSJ8jl5gnqac0tsj3IKnnsu1gWJDp5kqfLe0o' }}
        run: npm run build

      - name: Configure Capacitor for Standalone APK (Localhost/Direct Supabase)
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.smgroupinfo.smm",
            "appName": "SM Marketing",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"],
              "cleartext": true
            }
          }
          EOF

      - name: Sync Capacitor Android Engine
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Android Permissions into AndroidManifest.xml
        run: |
          node -e "
            const fs = require('fs');
            const path = 'android/app/src/main/AndroidManifest.xml';
            if (!fs.existsSync(path)) {
              console.error('Error: ' + path + ' not found!');
              process.exit(1);
            }
            let xml = fs.readFileSync(path, 'utf8');
            xml = xml.replace(/<uses-permission[^>]*\/>\s*/g, '');
            xml = xml.replace(/<uses-feature[^>]*\/>\s*/g, '');
            
            const perms = [
              '<!-- Network -->',
              '<uses-permission android:name=\"android.permission.INTERNET\" />',
              '<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />',
              '<uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />',
              '<!-- Location -->',
              '<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />',
              '<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />',
              '<uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />',
              '<uses-feature android:name=\"android.hardware.location.network\" android:required=\"false\" />',
              '<!-- Camera -->',
              '<uses-permission android:name=\"android.permission.CAMERA\" />',
              '<uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />',
              '<uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />',
              '<!-- Audio / Microphone -->',
              '<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />',
              '<uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />',
              '<uses-feature android:name=\"android.hardware.microphone\" android:required=\"false\" />',
              '<!-- Notifications (Android 13+) -->',
              '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />',
              '<!-- Vibration -->',
              '<uses-permission android:name=\"android.permission.VIBRATE\" />',
              '<!-- Storage -->',
              '<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />',
              '<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />',
              '<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />',
              '<uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />',
              '<uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />'
            ].join('\n    ');

            const manifestRegex = /<manifest\b[^>]*>/;
            if (manifestRegex.test(xml)) {
              xml = xml.replace(manifestRegex, (match) => match + '\n    ' + perms + '\n');
              fs.writeFileSync(path, xml, 'utf8');
              console.log('Successfully injected all hardware and notification permissions into AndroidManifest.xml');
            } else {
              console.error('Could not locate <manifest> tag in ' + path);
              process.exit(1);
            }
          "

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smm-field-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
