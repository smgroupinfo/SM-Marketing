name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android bcryptjs

      - name: Build Web App with Direct Supabase Fallbacks
        env:
          # Uses GitHub Secrets if available, otherwise falls back to your Supabase project credentials
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qbmezzgtsirybenjrsnb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibWV6emd0c2lyeWJlbmpyc25iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMzYxMTksImV4cCI6MjEwMjYxMjExOX0.VPdouvdSJ8jl5gnqac0tsj3IKnnsu1gWJDp5kqfLe0o' }}
        run: npm run build

      - name: Configure Capacitor for Standalone APK (Localhost/Direct Supabase)
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.smgroupinfo.smm",
            "appName": "SM Marketing",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"],
              "cleartext": true
            }
          }
          EOF

      - name: Sync Capacitor Android Engine
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smm-field-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
