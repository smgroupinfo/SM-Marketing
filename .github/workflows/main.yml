name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android bcryptjs

      - name: Build Web App with Direct Supabase Fallbacks
        env:
          # Uses GitHub Secrets if available, otherwise falls back to your Supabase project credentials
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qbmezzgtsirybenjrsnb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibWV6emd0c2lyeWJlbmpyc25iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMzYxMTksImV4cCI6MjEwMjYxMjExOX0.VPdouvdSJ8jl5gnqac0tsj3IKnnsu1gWJDp5kqfLe0o' }}
        run: npm run build

      - name: Configure Capacitor for Standalone APK (Localhost/Direct Supabase)
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.smgroupinfo.smm",
            "appName": "SM Marketing",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"],
              "cleartext": true
            }
          }
          EOF

      - name: Sync Capacitor Android Engine
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Android Permissions into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting Android hardware and system permissions into $MANIFEST..."
            
            # Remove any existing permissions to avoid duplicates
            sed -i '/<uses-permission/d' "$MANIFEST"
            sed -i '/<uses-feature/d' "$MANIFEST"
            
            # Prepare permissions and features block
            PERMISSIONS_BLOCK=$(cat <<'EOF'
    <!-- Network & Connectivity -->
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

    <!-- Location Permissions -->
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-feature android:name="android.hardware.location.gps" android:required="false" />
    <uses-feature android:name="android.hardware.location.network" android:required="false" />

    <!-- Camera Permissions -->
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-feature android:name="android.hardware.camera" android:required="false" />
    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

    <!-- Audio / Microphone Permissions -->
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-feature android:name="android.hardware.microphone" android:required="false" />

    <!-- Notifications (Android 13+ / API 33+) -->
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

    <!-- Vibration & Hardware Feedback -->
    <uses-permission android:name="android.permission.VIBRATE" />

    <!-- Storage (Legacy / Media Fallbacks) -->
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
EOF
)
            
            # Insert permissions block right after the opening <manifest ...> tag
            node -e "
              const fs = require('fs');
              let content = fs.readFileSync('$MANIFEST', 'utf8');
              const manifestTagRegex = /<manifest\b[^>]*>/;
              const permissions = \`\n$PERMISSIONS_BLOCK\n\`;
              if (manifestTagRegex.test(content)) {
                content = content.replace(manifestTagRegex, (match) => match + permissions);
                fs.writeFileSync('$MANIFEST', content, 'utf8');
                console.log('Successfully updated AndroidManifest.xml with all hardware permissions.');
              } else {
                console.error('Could not locate <manifest> tag in $MANIFEST');
              }
            "
          else
            echo "Error: $MANIFEST not found!"
            exit 1
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smm-field-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
